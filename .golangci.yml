version: "2"
run:
  build-tags:
    - infra

linters:
  default: none
  enable:
    - errcheck
    - goconst
    - gocritic
    - govet
    - ineffassign
    - lll
    - misspell
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    errcheck:
      check-type-assertions: false
      check-blank: false
    goconst:
      min-occurrences: 3
    lll:
      line-length: 160
      tab-width: 1
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go$|^tests/|^samples/|fixtures\.go$
        linters:
          - errcheck
          - lll
      - path: (.+)\.go$
        text: composite literal uses unkeyed fields
      - linters: [revive]
        text: exported
      - linters: [revive]
        text: package-comments
      - linters: [revive]
        text: redefines-builtin-id
      - linters: [revive]
        text: unused-parameter
      - linters: [staticcheck]
        text: QF1012
      - linters: [gocritic]
        text: exitAfterDefer
      - linters: [gocritic]
        text: appendAssign
      - linters: [errcheck]
        text: Close
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/theskyinflames/word2png/
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
